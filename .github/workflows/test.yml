name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/**"
      - "README.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "assets/**"
      - "README.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint_ruff.yml
    permissions:
      contents: read

  unit-tests:
    name: Unit tests
    uses: ./.github/workflows/unit-tests.yml
    permissions:
      contents: read